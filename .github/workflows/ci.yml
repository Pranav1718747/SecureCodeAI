name: SecureCodeAI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Backend Tests
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-insecure-secret-key-for-testing"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          GROQ_API_KEY: "dummy-groq-key-for-testing"
          PYTHONPATH: ".:backend"
        run: |
          python backend/manage.py test core accounts
          pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
