name: SecureCodeAI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django Unit Tests
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-insecure-secret-key-for-testing"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          GROQ_API_KEY: "dummy-groq-key-for-testing"
          PYTHONPATH: ".:backend"
          CI: "true"
        run: |
          python backend/manage.py test core accounts -v 2
      - name: Run Pytest QA Suite
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-insecure-secret-key-for-testing"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          GROQ_API_KEY: "dummy-groq-key-for-testing"
          PYTHONPATH: ".:backend"
          CI: "true"
        run: |
          python -m pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
