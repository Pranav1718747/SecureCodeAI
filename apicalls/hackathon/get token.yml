info:
  name: get token
  type: http

http:
  method: POST
  url: 127.0.0.1:8000/api/v1/accounts/token/
  headers:
    - name: ""
      value: ""
  body:
    type: json
    data: |
      {
        "email": "ceo@mycompany.com",
        "password": "super_secure_password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
