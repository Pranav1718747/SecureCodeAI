# Render.com Infrastructure-as-Code Blueprint
# Deploy SecureCode AI with 1 Click

databases:
  - name: securecode-db
    databaseName: securecodeai
    user: securecode_admin
    plan: free
    region: oregon

services:
  # 1. Redis Key-Value Store (For Celery broker & WebSockets layer)
  - type: redis
    name: securecode-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal access only

  # 2. Daphne ASGI Backend Web Service (REST API + WebSockets)
  - type: web
    name: securecode-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python backend/manage.py migrate --noinput"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securecode-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securecode-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://securecode-frontend.onrender.com"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 3. Celery Worker (Background AI Scans & Patching)
  - type: worker
    name: securecode-celery-worker
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && celery -A config worker -l INFO"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: securecode-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: securecode-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securecode-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 4. React Vite Frontend Static Site
  - type: web
    name: securecode-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://securecode-backend.onrender.com"
      - key: VITE_WS_HOST
        value: "securecode-backend.onrender.com"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
